<div class="row" [class.row--stack]="layout() === 'stack'" role="radiogroup" aria-label="Coastal area">
  @for (region of regions; track region.id) {
    <bl-chip
      [selected]="state.region().id === region.id"
      (selectedChange)="select(region.id)"
    >
      {{ region.label }}
    </bl-chip>
  }
</div>
@if (showSummary()) {
  <p class="summary">{{ state.region().summary }}</p>
}
