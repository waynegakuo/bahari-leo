@if (panels().length) {
  <section class="comic" aria-label="Today's comic edition">
    <header class="masthead">
      <bl-kicker>{{ generated() ? 'Today\'s comic · Toleo la bahari' : 'Today\'s edition' }}</bl-kicker>
      @if (title(); as line) {
        <h2 class="title bl-display">{{ line }}</h2>
      }
      @if (loading()) {
        <p class="status">The artist is inking the panels…</p>
      }
    </header>

    <div class="grid">
      @for (panel of panels(); track $index) {
        <figure class="panel">
          <bahari-sketch-art kind="pin" size="sm" class="panel-pin" />
          <p class="panel-kicker">{{ labelFor($index) }}</p>
          @if (panel.imageUrl) {
            <img class="art" [src]="panel.imageUrl" [alt]="labelFor($index) + ' — ' + panel.caption" loading="lazy" />
          } @else if (generated()) {
            <div class="art art--placeholder" aria-hidden="true"></div>
          }
          <blockquote class="bubble">
            <figcaption>{{ panel.caption }}</figcaption>
          </blockquote>
        </figure>
      }
    </div>

    @if (footer(); as line) {
      <p class="footer">{{ line }}</p>
    }
  </section>
}
